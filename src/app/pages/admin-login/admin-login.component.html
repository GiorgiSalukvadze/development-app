<div class="admin-login-page">
  <div class="login-container">
    <div class="login-card">
      <h1>Admin Login</h1>
      <p class="subtitle">Enter your credentials to access the admin panel</p>
      
      <form [formGroup]="loginForm" (ngSubmit)="login()" class="login-form">
        <div class="form-group">
          <label for="username">Username</label>
          <input 
            id="username"
            type="text" 
            formControlName="username" 
            placeholder="admin"
            [disabled]="isLoading"
          />
        </div>
        
        <div class="form-group">
          <label for="password">Password</label>
          <input 
            id="password"
            type="password" 
            formControlName="password" 
            placeholder="••••••••"
            [disabled]="isLoading"
          />
        </div>
        
        <button type="submit" [disabled]="isLoading || loginForm.invalid" class="login-button">
          {{ isLoading ? 'Logging in...' : 'Login' }}
        </button>
        
        @if (authMessage) {
          <div class="message" [class.error]="authMessage === 'Invalid credentials.'">
            {{ authMessage }}
          </div>
        }
      </form>
    </div>
  </div>
</div>

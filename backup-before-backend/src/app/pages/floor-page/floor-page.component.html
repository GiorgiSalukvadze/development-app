<app-layout>
  <section class="floor-page-header">
    <div class="container">
      <div class="breadcrumb">
        <a routerLink="/buildings" class="breadcrumb-link">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m15 18-6-6 6-6"/>
          </svg>
          Back to Building
        </a>
        <span class="breadcrumb-separator">/</span>
        <span class="breadcrumb-current">{{ floor?.name }}</span>
      </div>
      
      @if (building && floor) {
        <h1 class="page-title">{{ building.name }} - {{ floor.name }}</h1>
        <p class="page-subtitle">
          Select a unit to view details and availability
        </p>
        
        <div class="legend">
          <div class="legend-item">
            <span class="legend-dot available"></span>
            <span>Available</span>
          </div>
          <div class="legend-item">
            <span class="legend-dot sold"></span>
            <span>Sold</span>
          </div>
        </div>
      }
    </div>
  </section>

  <section class="floor-content">
    @if (isLoading) {
      <div class="loading-container">
        <div class="loading-spinner"></div>
        <p>Loading floor plan...</p>
      </div>
    } @else if (floor) {
      <app-floor-view
        [floor]="floor"
        (unitSelected)="onUnitSelected($event)"
        (backToBuilding)="onBackToBuilding()">
      </app-floor-view>
    }
  </section>

  @if (selectedUnit) {
    <app-unit-modal
      [unit]="selectedUnit"
      (close)="onCloseModal()"
      (requestInfo)="onRequestInfo($event)">
    </app-unit-modal>
  }
</app-layout>

<div class="showcase-container">
  <!-- Header - Hidden, using layout -->
  <header class="showcase-header">
  </header>

  <!-- Loading State -->
  @if (isLoading) {
    <div class="loading-container">
      <div class="loading-spinner"></div>
      <p>Loading property data...</p>
    </div>
  }

  <!-- Main Content -->
  @if (!isLoading && currentBuilding) {
    <main class="showcase-main">
      <!-- View Container -->
      <div class="view-container">
        <app-building-view
          [building]="currentBuilding"
          (floorSelected)="onFloorSelected($event)"
        />
      </div>
    </main>
  }

  <!-- Unit Modal -->
  @if (selectedUnit) {
    <app-unit-modal
      [unit]="selectedUnit"
      (close)="onCloseModal()"
      (requestInfo)="onRequestInfo($event)"
    />
  }

  <!-- Footer - Hidden, using layout -->
  <footer class="showcase-footer">
  </footer>
</div>
